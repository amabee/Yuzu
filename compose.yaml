name: yuzu
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=seaweedfs",
        "-ip.bind=0.0.0.0",
        "-webdav=false",
        "-admin.ui=false",
        "-s3.port.iceberg=0",
        "-s3.port.lance=0",
        "-s3.autoCreateBucket=false",
        "-s3.allowDeleteBucketNotEmpty=false",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${YUZU_S3_ACCESS_KEY_ID:?Run pnpm setup:keys first}
      AWS_SECRET_ACCESS_KEY: ${YUZU_S3_SECRET_ACCESS_KEY:?Run pnpm setup:keys first}
      S3_BUCKET: ${YUZU_S3_BUCKET:-yuzu-attachments}
    ports:
      - "127.0.0.1:${YUZU_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9333/cluster/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  seaweedfs-console:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      ["admin", "-master=seaweedfs:9333", "-ip=0.0.0.0", "-dataDir=/data"]
    environment:
      WEED_ADMIN_USER: ${YUZU_SEAWEED_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${YUZU_SEAWEED_ADMIN_PASSWORD:?Run pnpm setup:keys first}
    ports:
      - "127.0.0.1:${YUZU_SEAWEED_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs_console_data:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:23646/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yuzu}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yuzu}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      YUZU_STORAGE_PROVIDER: S3
      YUZU_S3_ENDPOINT: http://seaweedfs:8333
      YUZU_S3_BUCKET: ${YUZU_S3_BUCKET:-yuzu-attachments}
      YUZU_S3_ACCESS_KEY_ID: ${YUZU_S3_ACCESS_KEY_ID:?Run pnpm setup:keys first}
      YUZU_S3_SECRET_ACCESS_KEY: ${YUZU_S3_SECRET_ACCESS_KEY:?Run pnpm setup:keys first}
      REALTIME_SECRET: ${REALTIME_SECRET:?Run pnpm setup:keys first}
      REALTIME_INTERNAL_URL: http://realtime:3001
      # Automation webhooks read signing secrets encrypted by the web app.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Run pnpm setup:keys first}
      # Email set up as 127.0.0.1 (Mailpit) is reached by service name here.
      YUZU_LOOPBACK_SMTP_HOST: ${YUZU_LOOPBACK_SMTP_HOST:-mailpit}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    environment:
      REALTIME_SECRET: ${REALTIME_SECRET:?Run pnpm setup:keys first}
      REALTIME_ALLOWED_ORIGIN: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "127.0.0.1:${REALTIME_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  seaweedfs_console_data:
  seaweedfs_data:
  postgres_data:
  mailpit_data:
