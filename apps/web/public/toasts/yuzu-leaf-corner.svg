<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 20 136 66" width="272" height="132" role="img" aria-label="Yuzu leaves">
  <title>Yuzu leaves (corner)</title>
  <style>
    .leaf-big, .leaf-small {
      transform-box: fill-box;
      animation: yuzu-toast-leaf-sway 4.2s ease-in-out infinite alternate;
      will-change: transform;
    }
    .leaf-big { transform-origin: 100% 100%; }
    .leaf-small {
      transform-origin: 0% 100%;
      animation-duration: 3.4s;
      animation-delay: -1.1s;
    }
    @keyframes yuzu-toast-leaf-sway {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaf-big, .leaf-small { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="leaf-big-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B5E57"/>
      <stop offset="55%" stop-color="#17917A"/>
      <stop offset="100%" stop-color="#6CCB6B"/>
    </linearGradient>
    <linearGradient id="leaf-small-grad" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0E8070"/>
      <stop offset="100%" stop-color="#A6DE6B"/>
    </linearGradient>
  </defs>

  <!-- Mascot leaves, mirrored so they point up and out of a top-left corner.
       Base of the leaves sits at (180, 80) in this viewBox. -->
  <g transform="translate(320 0) scale(-1 1)">
    <path class="leaf-small" d="M140 80 C122 78 104 68 98 52 C118 46 136 54 144 74 Z" fill="url(#leaf-small-grad)"/>
    <g class="leaf-big">
    <path d="M140 80 C136 50 154 30 182 28 C198 26 212 26 222 28 C214 52 198 68 176 74 C160 78 148 80 140 80 Z" fill="url(#leaf-big-grad)"/>
    <path d="M144 76 C158 52 180 40 214 32" fill="none" stroke="#9BE39A" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>
</svg>
