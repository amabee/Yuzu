<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Yuzu logo">
  <title>Yuzu</title>
  <style>
    /* Idle loop: the fruit breathes, the leaves sway on the breeze, the eyes blink and glance around. */
    #fruit   { transform-box: view-box; transform-origin: 138px 236px; animation: bob 3.6s ease-in-out infinite; }
    #leaf-big   { transform-box: view-box; transform-origin: 140px 80px; animation: sway-big 3.6s ease-in-out infinite; }
    #leaf-small { transform-box: view-box; transform-origin: 142px 78px; animation: sway-small 3.6s ease-in-out infinite; animation-delay: -.5s; }
    #eyes  { animation: glance 9s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    #mouth { transform-box: fill-box; transform-origin: 50% 0; animation: grin 3.6s ease-in-out infinite; }

    @keyframes bob        { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-4px) scale(.985,1.015); } }
    @keyframes sway-big   { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
    @keyframes sway-small { 0%,100% { transform: rotate(7deg); }  50% { transform: rotate(-6deg); } }
    @keyframes blink      { 0%,90%,94%,100% { transform: scaleY(1); } 92% { transform: scaleY(.08); }
                            96% { transform: scaleY(1); } 97.5% { transform: scaleY(.08); } 99% { transform: scaleY(1); } }
    @keyframes glance     { 0%,38%,72%,100% { transform: translate(0,0); } 44%,62% { transform: translate(3px,-1px); } }
    @keyframes grin       { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.08); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="body-grad" cx="52%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFEF63"/>
      <stop offset="45%" stop-color="#FFD83A"/>
      <stop offset="100%" stop-color="#FB9A12"/>
    </radialGradient>
    <linearGradient id="leaf-big-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B5E57"/>
      <stop offset="55%" stop-color="#17917A"/>
      <stop offset="100%" stop-color="#6CCB6B"/>
    </linearGradient>
    <linearGradient id="leaf-small-grad" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0E8070"/>
      <stop offset="100%" stop-color="#A6DE6B"/>
    </linearGradient>
    <clipPath id="mouth-clip">
      <path d="M120 162 L156 162 C156 178 148 190 138 190 C128 190 120 178 120 162 Z"/>
    </clipPath>
  </defs>

  <g id="fruit">
    <!-- leaves -->
    <g id="leaves">
      <path id="leaf-small" d="M140 80 C122 78 104 68 98 52 C118 46 136 54 144 74 Z" fill="url(#leaf-small-grad)"/>
      <g id="leaf-big">
        <path d="M140 80 C136 50 154 30 182 28 C198 26 212 26 222 28 C214 52 198 68 176 74 C160 78 148 80 140 80 Z" fill="url(#leaf-big-grad)"/>
        <path d="M144 76 C158 52 180 40 214 32" fill="none" stroke="#9BE39A" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
      </g>
    </g>

    <!-- fruit body (center x = 138) -->
    <ellipse id="body" cx="138" cy="156" rx="84" ry="80" fill="url(#body-grad)"/>

    <!-- freckles: mirrored around x = 138 -->
    <g id="freckles" fill="#D9731A" opacity="0.5">
      <circle cx="88" cy="164" r="2.6"/>
      <circle cx="98" cy="170" r="2.2"/>
      <circle cx="86" cy="175" r="2.2"/>
      <circle cx="96" cy="180" r="2"/>
      <circle cx="188" cy="164" r="2.6"/>
      <circle cx="178" cy="170" r="2.2"/>
      <circle cx="190" cy="175" r="2.2"/>
      <circle cx="180" cy="180" r="2"/>
    </g>

    <!-- eyes -->
    <g id="eyes">
      <g transform="translate(111 140)">
        <g class="eye eye-left">
          <ellipse rx="9" ry="14" fill="#1E2340"/>
          <ellipse cx="-2" cy="-5" rx="2.6" ry="4.2" fill="#FFFFFF"/>
        </g>
      </g>
      <g transform="translate(165 140)">
        <g class="eye eye-right">
          <ellipse rx="9" ry="14" fill="#1E2340"/>
          <ellipse cx="-2" cy="-5" rx="2.6" ry="4.2" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- open "D" smile -->
    <g id="mouth">
      <path d="M120 162 L156 162 C156 178 148 190 138 190 C128 190 120 178 120 162 Z" fill="#1E2340" stroke="#1E2340" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="138" cy="188" rx="11" ry="8" fill="#FF7A8A" clip-path="url(#mouth-clip)"/>
    </g>
  </g>
</svg>
